<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Tab icon -->
  <rect x="20" y="30" width="80" height="60" rx="8" ry="8" fill="#ffffff" opacity="0.9"/>
  
  <!-- Tab content lines -->
  <rect x="30" y="45" width="40" height="3" rx="1.5" fill="#667eea"/>
  <rect x="30" y="55" width="60" height="2" rx="1" fill="#667eea" opacity="0.7"/>
  <rect x="30" y="65" width="50" height="2" rx="1" fill="#667eea" opacity="0.5"/>
  
  <!-- Plus icon for "add" -->
  <circle cx="90" cy="50" r="12" fill="#10b981"/>
  <line x1="85" y1="50" x2="95" y2="50" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="45" x2="90" y2="55" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
