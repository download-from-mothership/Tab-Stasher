name               = "tab-stasher"
main               = ".open-next/worker.js"
compatibility_date = "2025-07-06"
compatibility_flags = ["nodejs_compat","global_fetch_strictly_public"]

[vars]
  # your NEXTAUTH_URL, SUPABASE_URL, etc.

# if you need any secrets:
# (run `wrangler secret put FOO` for each one instead of hard-coding here)

[assets]
binding   = "ASSETS"
directory = ".open-next/assets"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "tab-stasher-cache"

[observability.logs]
enabled = true